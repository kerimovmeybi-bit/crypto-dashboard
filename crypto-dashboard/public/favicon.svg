<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Градиент монеты -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    
    <!-- Градиент блика -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Внешний круговой контур -->
  <circle cx="32" cy="32" r="30" fill="url(#coinGrad)" stroke="#B45309" stroke-width="2" />
  <circle cx="32" cy="32" r="25" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="3 2" />

  <!-- Блик сверху -->
  <path d="M 12 24 A 23 23 0 0 1 52 24 A 25 25 0 0 0 12 24 Z" fill="url(#shineGrad)" />

  <!-- Символ ₿ / Крипто-значок в центре -->
  <path d="M 27 18 V 46 M 35 18 V 46 M 24 23 H 37 C 41 23 43 25 43 28 C 43 31 40 33 36 33 H 24 H 38 C 42 33 44 35 44 39 C 44 43 41 45 36 45 H 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>